# Cohort, signal thresholds, and scoring config (plan §5.1, §8, §10).
# Nothing in tools/signal_tools.py or ingest/synthetic.py hardcodes these —
# they all read from here, so changing the cohort or a threshold is a config
# edit, not a code change.
version: "1.0.0"

cohort:
  taxonomy_prefix: "332" # DME suppliers — chosen for enforcement density and clean taxonomy boundaries
  states: ["FL", "TX", "CA"]

# Every signal tool records the threshold it used, so a case packet is
# reproducible even if this file changes later.
thresholds:
  address_degree: 5
  phone_degree: 5
  officer_degree: 4
  enumeration_burst_count: 5
  enumeration_burst_window_days: 90
  address_churn_count: 3
  address_churn_window_days: 365
  exclusion_proximity_max_hops: 3
  community_exclusion_density_min_fraction: 0.15
  geographic_spread_min_km: 1500.0
  phoenix_pattern_max_months_since_exclusion: 24
  # M11 (CLAUDE.md Amendment 4(c)) — Physical Existence. The Maps call is a
  # GATE, not a source of numbers: `physical_existence`'s value is the count of
  # providers co-located at the address, which comes from Cypher like every
  # other detector's number. `min_colocated: 1.0` means "any provider at an
  # implausible-type address is worth surfacing"; raise it to only surface
  # clusters. `implausible_types` must be values of `contracts.LocationType`.
  physical_existence_min_colocated: 1.0
  physical_existence_implausible_types: ["residential", "mailbox_store"]
  # Nearby-Search radius. 50m keeps the result to the building and its
  # immediate neighbours; widening it makes every suburban house look
  # commercial. Measured 2026-08-18: a real suburban house returns 0
  # establishments at 40m, a medical campus returns 18.
  physical_existence_radius_m: 50
  # Google place types that mark an establishment as medical. A DME supplier
  # in a medical office building is the ordinary, innocent configuration —
  # this is what stops it firing on one.
  physical_existence_medical_place_types:
    ["doctor", "health", "hospital", "pharmacy", "dentist", "physiotherapist"]
  # Mailbox-store detection needs BOTH the `post_office` place type and these
  # name patterns: measured live, a UPS Authorized Shipping Outlet carries
  # only ['establishment', 'point_of_interest'] and a PostNet only adds
  # 'store', so the type alone misses most of them.
  physical_existence_mail_service_patterns:
    ["ups store", "postnet", "mail box", "mailbox", "pak mail", "postal annex"]
  # B2 (plan §7.1) is above the cache boundary and shared by every agent —
  # all 255 communities would add ~20k tokens to every single call, so only
  # the top N by member_count are rendered (graph/summaries.py render_b2).
  community_summary_cap: 40

# Overlapping signals that derive from one underlying fact collapse into one
# family weight (plan §10 — required so e.g. address_degree and
# enumeration_burst, which are both about the same address cluster, don't
# get counted as two independent indicators).
#
# M11 added a FOURTH family, `physical_existence`. It is deliberately not
# folded into `address_anomaly`: that family's members are all graph-degree
# facts about an address, whereas this one is a fact about what KIND of place
# the address is, sourced externally. Folding them would let one Maps call
# raise a family whose other members measure something else entirely — the
# double-counting the family mechanism exists to prevent.
#
# NOTE (BUILD_MILESTONES.md D-24): `escalation_gate.min_independent_signal_
# families: 3` now means "3 of 4" rather than "all 3". That is a real change to
# how demanding the gate is. Re-measure the tier distribution; do NOT tune the
# gate to compensate in either direction.
signal_families:
  address_anomaly: [address_degree, enumeration_burst, address_churn]
  network_anomaly: [phone_degree, officer_degree, geographic_spread]
  adverse_history: [exclusion_proximity, community_exclusion_density, phoenix_pattern]
  physical_existence: [physical_existence]

# Escalation gate (plan §10, verbatim):
#   high_priority requires:
#     >= 3 materially independent signal families
#     AND >= 1 authoritative government source OR strong quantitative anomaly
#     AND no unresolved critical entity-match conflict
#     AND evidence freshness within threshold
# The last two conditions are evaluated by workflow/state.py's ScoringService
# (M6) against live case state, not by a static threshold here.
escalation_gate:
  min_independent_signal_families: 3
  evidence_freshness_days: 180

# M12 (CLAUDE.md Amendment 4(b)) — `IsolationForest` anomaly scorer over the
# structural features `tools/signal_tools.py`'s detectors already compute.
# Trained unsupervised (`scripts/70_train_anomaly_model.py`) on the real
# cohort; NEVER a fraud probability (plan §16). Dashboard-only output — see
# BUILD_MILESTONES.md M12 Result for why it stays out of `ScoringService`.
ml:
  feature_order:
    [
      "address_degree",
      "phone_degree",
      "officer_degree",
      "enumeration_burst_count",
      "address_churn_count",
      "exclusion_proximity_hops",
      "community_exclusion_density",
      "geographic_spread_km",
      "establishment_count",
      "medical_establishment_count",
      "location_type_ordinal",
      "phoenix_pattern_detected",
    ]
  location_type_order:
    ["commercial_medical", "commercial", "unclassified", "residential", "mailbox_store"]
  # Matches thresholds.exclusion_proximity_max_hops (3) deliberately: this is
  # the same unrestricted-relationship-type shortestPath pattern the signal
  # detector uses, and it is already proven at 250-provider concurrent
  # screening scale. Measured 2026-08-18: raising this to 6 made a 10-row
  # batch exceed two minutes — do not raise it without re-measuring cost on
  # the full ~7,000-row training cohort first.
  exclusion_proximity_feature_max_hops: 3
  random_state: 20260101
  n_estimators: 200
  contamination: "auto"
  model_version: "isoforest-v1"
