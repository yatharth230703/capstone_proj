<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Specter{% endblock %} — Specter</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@13.0.3/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
function renderMarkdown(el, text) {
  el.innerHTML = DOMPurify.sanitize(marked.parse(text || ""));
}
</script>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161c; --panel: #1c1f27; --border: #2c3040; --text: #e4e6eb;
    --muted: #8b90a0; --accent: #6ea8fe; --warn: #e8b339; --high: #e05a5a;
    --standard: #e8b339; --low: #5fb0a3;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text); margin: 0;
    font: 14px/1.5 ui-monospace, "SF Mono", Consolas, monospace;
  }
  nav {
    display: flex; gap: 1.5rem; padding: 0.9rem 1.5rem;
    border-bottom: 1px solid var(--border); align-items: baseline;
  }
  nav a { color: var(--text); text-decoration: none; }
  nav a:hover { color: var(--accent); }
  nav .brand { font-weight: 700; margin-right: auto; }
  main { max-width: 980px; margin: 0 auto; padding: 1.5rem; }
  h1, h2, h3 { font-weight: 600; }
  h1 { font-size: 1.3rem; }
  h2 { font-size: 1.05rem; margin-top: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.3rem; }
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 1rem; margin: 0.75rem 0;
  }
  .note { color: var(--muted); font-size: 0.85rem; }
  .stat-row { display: flex; gap: 1rem; flex-wrap: wrap; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 0.6rem 1rem; min-width: 8rem; }
  .stat .n { font-size: 1.4rem; font-weight: 700; display: block; }
  .stat .l { color: var(--muted); font-size: 0.78rem; }
  table { border-collapse: collapse; width: 100%; margin: 0.5rem 0; }
  th, td { text-align: left; padding: 0.35rem 0.6rem; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 0.8rem; }
  a.npi { color: var(--accent); text-decoration: none; }
  a.npi:hover { text-decoration: underline; }
  .bar-row { display: grid; grid-template-columns: 9rem 1fr 3rem; gap: 0.5rem; align-items: center; margin: 0.25rem 0; }
  .bar-track { background: var(--border); border-radius: 3px; height: 0.9rem; overflow: hidden; }
  .bar-fill { background: var(--accent); height: 100%; }
  .bar-fill.high_priority, .bar-fill.high { background: var(--high); }
  .bar-fill.standard { background: var(--standard); }
  .bar-fill.low { background: var(--low); }
  .badge { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 3px; font-size: 0.78rem; }
  .badge.high_priority { background: var(--high); color: #1a0d0d; }
  .badge.standard { background: var(--standard); color: #241c04; }
  .badge.low { background: var(--low); color: #06231d; }
  pre { white-space: pre-wrap; background: #10121a; border: 1px solid var(--border);
    border-radius: 6px; padding: 0.9rem; overflow-x: auto; }
  .limitation { border: 1px solid var(--warn); background: #2a2310; color: #f0d488;
    border-radius: 6px; padding: 0.9rem; margin: 0.75rem 0; white-space: pre-wrap; }
  button { background: var(--accent); color: #0c1520; border: none; border-radius: 4px;
    padding: 0.5rem 1rem; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: default; }
  input[type=text] { width: 100%; padding: 0.4rem 0.6rem; background: #10121a;
    border: 1px solid var(--border); border-radius: 4px; color: var(--text); font: inherit; }
  .error { color: var(--high); }
  .markdown-body { line-height: 1.6; }
  .markdown-body h1, .markdown-body h2, .markdown-body h3 {
    border: none; margin: 1rem 0 0.4rem; padding: 0; font-size: 0.95rem;
  }
  .markdown-body p { margin: 0.5rem 0; }
  .markdown-body ul, .markdown-body ol { margin: 0.4rem 0; padding-left: 1.4rem; }
  .markdown-body li { margin: 0.15rem 0; }
  .markdown-body code { background: #10121a; padding: 0.1rem 0.3rem; border-radius: 3px; }
  .markdown-body strong { color: #fff; }
  .markdown-body a { color: var(--accent); }
  .legend { display: flex; gap: 1rem; flex-wrap: wrap; margin: 0.5rem 0 0; font-size: 0.8rem; color: var(--muted); }
  .legend .swatch {
    display: inline-block; width: 0.7rem; height: 0.7rem; border-radius: 50%;
    margin-right: 0.35rem; vertical-align: -1px;
  }
  .legend .swatch.star { border-radius: 2px; transform: rotate(45deg); }
  #node-info { min-height: 1.3rem; }
  .agent-map { display: flex; flex-wrap: wrap; align-items: stretch; gap: 0.25rem; }
  .agent-node {
    flex: 1 1 8rem; min-width: 8rem; border: 1px solid var(--border); border-radius: 6px;
    padding: 0.5rem 0.6rem; background: #10121a; transition: border-color 0.2s, background 0.2s;
  }
  .agent-node.code { border-style: dashed; }
  .agent-node-dot {
    width: 0.55rem; height: 0.55rem; border-radius: 50%; background: var(--border);
    display: inline-block; margin-right: 0.4rem;
  }
  .agent-node.active { border-color: var(--accent); background: #16233a; }
  .agent-node.active .agent-node-dot { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .agent-node.done { border-color: var(--low); }
  .agent-node.done .agent-node-dot { background: var(--low); }
  .agent-node.rejected { border-color: var(--high); }
  .agent-node.rejected .agent-node-dot { background: var(--high); }
  .agent-node-label { font-weight: 600; font-size: 0.82rem; }
  .agent-node-sub { color: var(--muted); font-size: 0.72rem; margin-top: 0.3rem; min-height: 1.6em; }
  .agent-map-arrow { align-self: center; color: var(--muted); flex: 0 0 auto; padding: 0 0.1rem; }
  .live-log {
    margin-top: 0.75rem; max-height: 16rem; overflow-y: auto; background: #10121a;
    border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem 0.7rem;
    font-size: 0.78rem; line-height: 1.7;
  }
  .live-log-entry { border-bottom: 1px dotted var(--border); padding: 0.1rem 0; }
  .live-log-entry:last-child { border-bottom: none; }
  .stage-tag, .agent-tag {
    display: inline-block; background: var(--border); color: var(--text); border-radius: 3px;
    padding: 0 0.35rem; margin-right: 0.35rem; font-size: 0.72rem;
  }
  .stage-tag.error { background: var(--high); color: #1a0d0d; }
</style>
</head>
<body>
<nav>
  <span class="brand">Specter</span>
  <a href="/ui">Cohort overview</a>
  <a href="/ui/judge">Judge report</a>
</nav>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
